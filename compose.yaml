# Shared by every dev service: one image, one view of the repo. They differ only
# in what they run.
#
# The repo is mounted at ${PWD} — its own absolute host path — rather than the
# conventional /workspaces/<name>. A git worktree's .git is a file holding an
# absolute host path into the main repo's .git/worktrees/; mounting anywhere
# else leaves that pointer dangling inside the container, and `git worktree
# repair` is not an option because it would break the host side in turn.
# Identical paths mean the pointer resolves untouched.
x-dev: &dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: reading-tracker-dev
  volumes:
    - .:${PWD}
    # node_modules is kept out of the bind mount. Every file a container reads
    # through a bind mount crosses the macOS filesystem boundary; for tens of
    # thousands of tiny files, that is the difference between a fast rebuild and
    # an unusable one. A named volume lives inside Docker's VM instead.
    - node_modules:${PWD}/frontend/node_modules

services:
  db:
    image: postgres:18
    environment:
      # Matches Railway, where the database user you are handed is a `postgres`
      # superuser. Same owner role name in every environment.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reading_tracker
    ports:
      # Defaulted inline so a fresh clone runs `docker compose up db` with no
      # .env file at all. Overridable for per-worktree stacks later (#179).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # NOT /var/lib/postgresql/data. Postgres 18 moved PGDATA to a
      # version-specific path (/var/lib/postgresql/18/docker) and moved the
      # declared VOLUME up to /var/lib/postgresql. Mounting the old path still
      # *starts cleanly* — it just silently persists nothing.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reading_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *dev
    working_dir: ${PWD}/backend
    # No DATABASE_URL: db_url.py defaults to the db service, which is correct
    # from inside any container here.
    # The same three steps as the production CMD, for the same reasons: create
    # the app role, apply migrations, then serve. Both leading steps are
    # idempotent, so they re-run harmlessly on every restart.
    command: >
      sh -c "python -m app.provision
      && alembic upgrade head
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    <<: *dev
    working_dir: ${PWD}/frontend
    # The named volume starts empty, so install into it on first boot and skip
    # the install on every boot after. postCreateCommand will cover the VS Code
    # path; this covers a plain `docker compose up`.
    command: >
      sh -c "[ -e node_modules/.package-lock.json ] || npm ci;
      exec npm start -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-4200}:4200"

  # Runs nothing on purpose. VS Code attaches with overrideCommand set, which
  # replaces the attached service's command with `sleep infinity` — attaching to
  # api would therefore kill uvicorn. This is also where `docker compose exec`
  # lands for tests, git, pre-commit and claude.
  workspace:
    <<: *dev
    working_dir: ${PWD}
    # `pre-commit install` writes .git/hooks/pre-commit, which git never clones —
    # so without this a fresh clone commits with no checks at all, silently
    # (#164). Idempotent and near-instant, so it runs every boot rather than
    # carrying a guard. `;` rather than `&&`: a failure here should not leave the
    # workspace container dead.
    command: >
      sh -c "pre-commit install;
      exec sleep infinity"
    # Listed in full rather than inherited: a service's own `volumes:` replaces
    # the anchor's list outright — YAML merge keys work key by key and cannot
    # append to a list — so dropping the first two would leave a container with
    # config mounts and no repo in it.
    #
    # These are personal, which is why CI runs its checks against the api
    # service instead: none of these paths exist on a runner, and a bind mount
    # pointing at a missing path silently creates an empty directory rather
    # than failing.
    volumes:
      - .:${PWD}
      - node_modules:${PWD}/frontend/node_modules
      # Claude's settings, skills, memory and session history. The memory
      # directory is keyed by project path, which the identical-path mount
      # leaves unchanged, so sessions carry over from host to container.
      #
      # Credentials do NOT carry over: macOS keeps them in the Keychain, which a
      # Linux container cannot read. `claude` and `gh` each need one login
      # inside, after which both persist here through the bind mount.
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.claude.json:/root/.claude.json
      - ${HOME}/.gitconfig:/root/.gitconfig
      - ${HOME}/.config/gh:/root/.config/gh

volumes:
  pgdata:
  node_modules:
