# Environment shared by every dev service. Its own anchor rather than being
# inline below, because a service that declares `environment:` replaces the
# merged one outright (see workspace) — this way the values are written once.
x-dev-env: &dev-env
  # Signs the session cookie. Deliberately a known value, not a secret: local
  # and CI sessions live in a database that gets thrown away, and CI runs its
  # backend checks through these same service definitions rather than a parallel
  # setup. Production sets a real one in its own environment, where main.py
  # still refuses to boot without it.
  #
  # Being non-secret is also what unbreaks Dependabot: GitHub withholds repo
  # secrets from Dependabot-triggered runs, so a workflow reading
  # secrets.SESSION_SECRET got an empty string and every job that imports the
  # app died on the start-up check.
  SESSION_SECRET: local-dev-only

# Shared by every dev service: one image, one view of the repo. They differ only
# in what they run.
#
# The repo is mounted at ${PWD} — its own absolute host path — rather than the
# conventional /workspaces/<name>. A git worktree's .git is a file holding an
# absolute host path into the main repo's .git/worktrees/; mounting anywhere
# else leaves that pointer dangling inside the container, and `git worktree
# repair` is not an option because it would break the host side in turn.
# Identical paths mean the pointer resolves untouched.
x-dev: &dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: reading-tracker-dev
  environment: *dev-env
  volumes:
    - .:${PWD}
    # node_modules is kept out of the bind mount. Every file a container reads
    # through a bind mount crosses the macOS filesystem boundary; for tens of
    # thousands of tiny files, that is the difference between a fast rebuild and
    # an unusable one. A named volume lives inside Docker's VM instead.
    - node_modules:${PWD}/frontend/node_modules

services:
  db:
    image: postgres:18
    environment:
      # Matches Railway, where the database user you are handed is a `postgres`
      # superuser. Same owner role name in every environment.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reading_tracker
    ports:
      # Defaulted inline so a fresh clone runs `docker compose up db` with no
      # .env file at all. Overridable for per-worktree stacks later (#179).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # NOT /var/lib/postgresql/data. Postgres 18 moved PGDATA to a
      # version-specific path (/var/lib/postgresql/18/docker) and moved the
      # declared VOLUME up to /var/lib/postgresql. Mounting the old path still
      # *starts cleanly* — it just silently persists nothing.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reading_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *dev
    working_dir: ${PWD}/backend
    # No DATABASE_URL: db_url.py defaults to the db service, which is correct
    # from inside any container here.
    # The same three steps as the production CMD, for the same reasons: create
    # the app role, apply migrations, then serve. Both leading steps are
    # idempotent, so they re-run harmlessly on every restart.
    command: >
      sh -c "python -m app.provision
      && alembic upgrade head
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # /docs is FastAPI's built-in Swagger page — free, always present if the
    # app booted, and the same URL webServer used to poll before this moved
    # into a container. start_period covers provision + migrate before uvicorn
    # is even listening, so those don't burn through retries.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    <<: *dev
    working_dir: ${PWD}/frontend
    # The named volume starts empty, so install into it on first boot and skip
    # the install on every boot after. Nothing else populates it: the image
    # deliberately does not bake node_modules in (see Dockerfile.dev).
    command: >
      sh -c "[ -e node_modules/.package-lock.json ] || npm ci;
      exec npm start -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    # Same idea as api's healthcheck above. start_period is generous because a
    # cold volume means npm ci first, then Angular's own build/compile — both
    # slower than the backend's boot.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Puts the dev stack on one origin: /api/* goes to api, everything else to
  # frontend. Not just for e2e — a human hitting the published port gets the
  # same single-origin view.
  proxy:
    image: caddy:2.11.4-alpine
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${PROXY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    # wget, not curl: the alpine image only ships BusyBox's applet.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Browser binaries live here and nowhere else.
  #
  # The test *process* runs on the dev image and drives these over a websocket
  # (playwright.config.ts sets connectOptions). That split is the point: browsers
  # and their system libraries never enter Dockerfile.dev, which the api and
  # frontend CI jobs both build on every run — and it is what lets a test process
  # in `workspace` reach the full browser matrix without a Docker socket, so
  # authoring and running the suite need no human in the loop.
  #
  # Not profiled: this is part of the standing stack, because anything running
  # tests needs it already up.
  browsers:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    working_dir: ${PWD}/e2e
    # Half of the authoring bridge; `workspace` holds the other half. Needed here
    # rather than on the test-process side because browser.bind() — what a
    # --debug=cli run calls to publish a paused session — is a channel call
    # executed by the *server*, so the descriptor and socket are created in this
    # container no matter where the test process runs.
    #
    # PWTEST_SOCKETS_DIR is an internal Playwright escape hatch (the PWTEST_
    # prefix is upstream's marker for "may move without notice"), accepted
    # because it is load-bearing for authoring only: nothing in the suite or CI
    # reads it, so the worst a version bump can do is stop `playwright cli
    # attach` working until the paths are found again.
    environment:
      PWTEST_SOCKETS_DIR: /tmp/pw-sockets
    volumes:
      - .:${PWD}
      - e2e_node_modules:${PWD}/e2e/node_modules
      # `playwright cli attach <name>` needs two things from whichever container
      # hosts the browser, and neither is where you would guess:
      #
      #   1. The descriptor bind() writes, which lands in
      #      ~/.cache/ms-playwright/**b** — NOT the .../daemon sibling, which is
      #      only the CLI *client's* scratch space for daemons it spawns itself.
      #   2. The Unix socket that descriptor points at, built from os.tmpdir()
      #      and so relocated out of the private /tmp by the env var above.
      #
      # Both must be shared, and shared *together*: serverRegistry.list() probes
      # every descriptor it can see and DELETES the ones it cannot connect to, so
      # a client that can read b/ but cannot reach the socket erases live
      # sessions rather than failing cleanly.
      #
      # Named volumes, not bind mounts: virtiofs does not carry Unix domain
      # sockets across the macOS host boundary.
      - playwright_registry:/root/.cache/ms-playwright/b
      - playwright_sockets:/tmp/pw-sockets
    # The same first-boot guard the frontend service uses, for the same reason:
    # the named volume starts empty and nothing else fills it. Legal here but not
    # on `e2e` below, because that one is only ever reached through
    # `docker compose run`, which replaces `command:` outright.
    #
    # The locally installed playwright rather than the docs' `npx -y
    # playwright@1.62.0`: it is the same package the specs import, so the
    # client/server version check cannot drift, and no fetch happens on boot.
    command: >
      sh -c "[ -e node_modules/.bin/playwright ] || npm ci;
      exec npx playwright run-server --host 0.0.0.0 --port 5000"
    # node, not curl or wget: the endpoint is a websocket, so an HTTP probe
    # proves nothing, and a bare TCP connect is what "accepting clients" means.
    # node is the one interpreter this image is guaranteed to have.
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('net').connect(5000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Not built from Dockerfile.dev like the services above — the browser binaries
  # come from Microsoft's own image, pinned to the same version as
  # @playwright/test in e2e/package.json (Playwright checks the two against
  # each other at launch and refuses to run on a mismatch).
  #
  # No `command:` on purpose: this service is only ever invoked as
  # `docker compose run --rm e2e <command>`, and `run` replaces a service's
  # `command:` outright, so anything written here would never actually execute.
  #
  # GOTCHA: e2e_node_modules starts life as an empty named volume, and unlike
  # frontend above, there's no boot-time `npm ci` guard installing into it —
  # `run`'s command-replacing behavior is exactly what rules that pattern out
  # here. Run `docker compose run --rm e2e npm ci` by hand the first time, and
  # again whenever e2e/package-lock.json changes; skipping it looks like a
  # broken container ("playwright: command not found") when it's really just
  # an empty volume.
  e2e:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    # Excludes this from `docker compose up` — it has no command (see below)
    # and would just start and exit immediately as part of the standing stack.
    # `docker compose run --rm e2e <command>` still works: profiles only gate
    # `up`, not `run`, and its dependencies (proxy, which needs api/frontend
    # healthy) still get started either way.
    profiles: ["tools"]
    working_dir: ${PWD}/e2e
    # No bridge mounts here: browsers no longer run in this container, so nothing
    # publishes a session from it. They live on `browsers` instead — see the
    # comment there for why bind() writes server-side.
    volumes:
      - .:${PWD}
      - e2e_node_modules:${PWD}/e2e/node_modules
    # Depending on proxy alone is enough: compose walks the chain, and proxy
    # already requires api and frontend to be healthy first.
    depends_on:
      proxy:
        condition: service_healthy

  # Runs nothing on purpose. VS Code attaches with overrideCommand set, which
  # replaces the attached service's command with `sleep infinity` — attaching to
  # api would therefore kill uvicorn. This is also where `docker compose exec`
  # lands for tests, git, pre-commit and claude.
  workspace:
    <<: *dev
    working_dir: ${PWD}
    # `pre-commit install` writes .git/hooks/pre-commit, which git never clones —
    # so without this a fresh clone commits with no checks at all, silently
    # (#164). Idempotent and near-instant, so it runs every boot rather than
    # carrying a guard. `;` rather than `&&`: a failure here should not leave the
    # workspace container dead.
    command: >
      sh -c "pre-commit install;
      exec sleep infinity"
    # Listed in full rather than inherited: a service's own `volumes:` replaces
    # the anchor's list outright — YAML merge keys work key by key and cannot
    # append to a list — so dropping the first two would leave a container with
    # config mounts and no repo in it.
    #
    # These are personal, which is why CI runs its checks against the api
    # service instead: none of these paths exist on a runner, and a bind mount
    # pointing at a missing path silently creates an empty directory rather
    # than failing.
    volumes:
      - .:${PWD}
      - node_modules:${PWD}/frontend/node_modules
      # `e2e`'s own node_modules, populated by `docker compose run --rm e2e
      # npm ci` (see the GOTCHA on that service). Shared here too so `npx
      # playwright cli` and `npx playwright test` resolve @playwright/test
      # from inside `workspace` — the client half of the authoring loop below.
      - e2e_node_modules:${PWD}/e2e/node_modules
      # The other half: see the matching comment on the `e2e` service. Both
      # mounts are required together — one without the other destroys live
      # sessions rather than failing cleanly.
      - playwright_registry:/root/.cache/ms-playwright/b
      - playwright_sockets:/tmp/pw-sockets
      # Claude's settings, skills, memory and session history. The memory
      # directory is keyed by project path, which the identical-path mount
      # leaves unchanged, so sessions carry over from host to container.
      #
      # Credentials do NOT carry over: macOS keeps them in the Keychain, which a
      # Linux container cannot read. `claude` and `gh` each need one login
      # inside, after which both persist here through the bind mount.
      #
      # ~/.claude.json is NOT bind-mounted directly as a file. It holds the
      # OAuth session, and a single-file bind mount pins to one inode — Claude
      # Code rewrites the file via write-temp-then-rename, which swaps in a new
      # inode the mount doesn't follow, corrupting the file. CLAUDE_CONFIG_DIR
      # below fixes this instead of a file mount: Claude Code resolves
      # .claude.json under that directory rather than under $HOME, so it lands
      # inside this already-mounted, already-reliable directory.
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.gitconfig:/root/.gitconfig
      # Not covered by .gitconfig above. With core.excludesFile unset, git reads
      # global ignore rules from the XDG path instead, so without this mount
      # none of them apply in the container and files ignored on the Mac show up
      # as untracked in here.
      - ${HOME}/.config/git:/root/.config/git
      - ${HOME}/.config/gh:/root/.config/gh
      # The origin remote is ssh, and the keys live in 1Password rather than on
      # disk — reachable only through its agent socket, which runs on the Mac.
      # Forwarding the socket lets git push from in here with the same key and
      # the same approval prompt as on the host; no key material is copied.
      - ${HOME}/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock:/tmp/1password-agent.sock
      # Deliberately not ~/.ssh as a whole: that directory's config sets
      # IdentityAgent to the socket's *macOS* path, which does not exist here and
      # would override SSH_AUTH_SOCK below. Only known_hosts is wanted, to skip
      # the first-connection host key prompt.
      - ${HOME}/.ssh/known_hosts:/root/.ssh/known_hosts
    # Merged rather than replaced, for the reason the volumes above spell out: a
    # service's own block wins outright, so without the merge key this container
    # would lose SESSION_SECRET and `pytest` in here would fail on import.
    environment:
      <<: *dev-env
      SSH_AUTH_SOCK: /tmp/1password-agent.sock

      # See the comment on the .claude mount above: this redirects
      # .claude.json into that already-mounted, already-persisted directory.
      CLAUDE_CONFIG_DIR: /root/.claude

      # Strictly, this side only needs the matching *mount* above: it connects to
      # the absolute socket path recorded in the descriptor, which `e2e` wrote.
      # Set anyway so both ends declare the same path, and so this container's
      # own CLI daemon does not scatter sockets somewhere unshared.
      PWTEST_SOCKETS_DIR: /tmp/pw-sockets

volumes:
  pgdata:
  node_modules:
  e2e_node_modules:
  playwright_registry:
  playwright_sockets:
