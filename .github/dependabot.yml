version: 2

multi-ecosystem-groups:
  playwright:
    schedule:
      interval: weekly

updates:
  # Regular npm updates, excluding Playwright
  - package-ecosystem: npm
    directories:
      - /frontend
      - /e2e
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: playwright
      - dependency-name: '@playwright/test'
    groups:
      # Each family is declared twice because `applies-to` takes a single value.
      # The security half is the one that matters: a lone @vitest/mocker advisory
      # bump is what left vitest 5 sitting next to @vitest/coverage-v8 4.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      vitest-security:
        applies-to: security-updates
        patterns:
          - vitest
          - '@vitest/*'
      storybook:
        patterns:
          - storybook
          - '@storybook/*'
          - eslint-plugin-storybook
          - '@chromatic-com/storybook'
      storybook-security:
        applies-to: security-updates
        patterns:
          - storybook
          - '@storybook/*'
          - eslint-plugin-storybook
          - '@chromatic-com/storybook'

  - package-ecosystem: npm
    directories:
      - /frontend
      - /e2e
    patterns:
      - playwright
      - '@playwright/test'
    multi-ecosystem-group: playwright

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-framework:
        patterns:
          - fastapi
          - pydantic
          - pydantic-core
          - starlette
          - uvicorn
      backend-database:
        patterns:
          - alembic
          - sqlalchemy
      backend-auth:
        patterns:
          - authlib
          - httpx
          - itsdangerous
      backend-tooling:
        dependency-type: development
        patterns:
          - '*'
      backend-security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # SQLAlchemy 2.1 changes bare PostgreSQL URLs from psycopg2 to psycopg3.
      # Remove this after the dedicated driver migration.
      - dependency-name: sqlalchemy
        versions:
          - '>=2.1'

  # compose.yaml: the playwright browsers image, postgres and caddy.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: playwright

  - package-ecosystem: docker-compose
    directory: /
    patterns:
      - playwright
    multi-ecosystem-group: playwright

  # Dockerfile and Dockerfile.dev: the python and node base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Adopt new Python minors deliberately after the package ecosystem has
      # published compatible wheels; keep receiving patch and digest updates.
      - dependency-name: python
        update-types:
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
