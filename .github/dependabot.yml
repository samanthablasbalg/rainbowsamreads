version: 2

multi-ecosystem-groups:
  playwright:
    schedule:
      interval: monthly

updates:
  # Routine Playwright updates belong to the cross-ecosystem group below. The
  # version-only ignores leave security updates eligible for the npm groups.
  - package-ecosystem: npm
    directories:
      - /frontend
      - /e2e
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: playwright
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: '@playwright/test'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      # Keep tightly coupled package families in the same routine update PR.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      storybook:
        patterns:
          - storybook
          - '@storybook/*'
          - eslint-plugin-storybook
          - '@chromatic-com/storybook'
      # Security updates run independently of the monthly version schedule. Keep
      # coupled package families together, then catch every remaining advisory.
      react-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      vitest-security:
        applies-to: security-updates
        patterns:
          - vitest
          - '@vitest/*'
      storybook-security:
        applies-to: security-updates
        patterns:
          - storybook
          - '@storybook/*'
          - eslint-plugin-storybook
          - '@chromatic-com/storybook'
      playwright-security:
        applies-to: security-updates
        patterns:
          - playwright
          - '@playwright/test'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      # A generator upgrade deserves its own review. Frontend CI regenerates the
      # client and fails if the committed output is stale.
      orval:
        patterns:
          - orval
      # Dependabot otherwise opens one PR for every unmatched dependency.
      npm-other:
        patterns:
          - '*'

  - package-ecosystem: npm
    directories:
      - /frontend
      - /e2e
    patterns:
      - playwright
      - '@playwright/test'
    multi-ecosystem-group: playwright

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend-framework:
        patterns:
          - fastapi
          - pydantic
          - pydantic-core
          - starlette
          - uvicorn
      backend-database:
        patterns:
          - alembic
          - sqlalchemy
      backend-auth:
        patterns:
          - authlib
          - httpx
          - itsdangerous
      backend-tooling:
        dependency-type: development
        patterns:
          - '*'
      backend-security:
        applies-to: security-updates
        patterns:
          - '*'
      # Keep unmatched runtime dependencies out of one-PR-per-package limbo.
      backend-other:
        patterns:
          - '*'
    ignore:
      # SQLAlchemy 2.1 changes bare PostgreSQL URLs from psycopg2 to psycopg3.
      # Remove this after the dedicated driver migration.
      - dependency-name: sqlalchemy
        versions:
          - '>=2.1'

  # compose.yaml: the playwright browsers image, postgres and caddy.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: playwright
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      compose-security:
        applies-to: security-updates
        patterns:
          - '*'
      compose:
        patterns:
          - '*'

  - package-ecosystem: docker-compose
    directory: /
    patterns:
      - playwright
    multi-ecosystem-group: playwright

  # Dockerfile and Dockerfile.dev: the python and node base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Adopt new Python minors deliberately after the package ecosystem has
      # published compatible wheels; keep receiving patch and digest updates.
      - dependency-name: python
        update-types:
          - version-update:semver-minor
    groups:
      base-images-security:
        applies-to: security-updates
        patterns:
          - '*'
      base-images:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
      actions:
        patterns:
          - '*'
