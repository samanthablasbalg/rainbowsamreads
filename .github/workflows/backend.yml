name: Backend CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    # No env at all. Every database URL is derived from a default pointing at the
    # compose database (backend/app/db_url.py), and SESSION_SECRET comes from the
    # service definition in compose.yaml — the same one development uses.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Every check below runs inside the same image used for development, so a
      # green run here means the same toolchain agreed. Nothing is installed on
      # the runner. The api service is used rather than workspace because
      # workspace mounts personal config from $HOME, which does not exist here.
      - name: Build the dev image
        run: docker compose build api

      - name: Start the database
        run: docker compose up db -d --wait

      - name: Run Ruff linter
        run: docker compose run --rm api ruff check .

      - name: Run Ruff formatter
        run: docker compose run --rm api ruff format --check .

      - name: Run mypy
        run: docker compose run --rm api mypy app

      - name: Run tests
        run: docker compose run --rm api sh -c 'pytest || [ $? -eq 5 ]'

      - name: Check committed OpenAPI schema is up to date
        run: |
          docker compose run --rm api python scripts/export_openapi.py
          git diff --exit-code backend/openapi.json
