name: Backend CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    # Every database URL is derived from a default pointing at the compose
    # database (backend/app/db_url.py), so nothing here needs configuring.
    env:
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The same container definition used locally, rather than a separately
      # maintained service block that can drift from it.
      - name: Start the database
        run: docker compose up db -d --wait

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: |
          cd backend
          ruff check .

      - name: Run Ruff formatter
        run: |
          cd backend
          ruff format --check .

      - name: Run mypy
        run: |
          cd backend
          mypy app

      - name: Run tests
        run: |
          cd backend
          pytest || [ $? -eq 5 ]

      - name: Check committed OpenAPI schema is up to date
        run: |
          cd backend
          python scripts/export_openapi.py
          git diff --exit-code openapi.json
