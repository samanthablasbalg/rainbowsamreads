name: Frontend CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same image as development, same as Backend CI. Nothing is installed on
      # the runner, so a green run here means the toolchain you develop with
      # agreed. node_modules lives in a named volume, which persists between
      # `docker compose run` invocations, so the install below is done once and
      # every later step sees it.
      - name: Build the dev image
        run: docker compose build frontend

      - name: Install dependencies
        run: docker compose run --rm frontend npm ci

      - name: Lint
        run: docker compose run --rm frontend npm run lint

      - name: Check formatting
        run: docker compose run --rm frontend npm run prettier:check

      - name: Typecheck
        run: docker compose run --rm frontend npm run typecheck

      - name: Test
        run: docker compose run --rm frontend npm test

      - name: Check committed API client is up to date
        run: |
          docker compose run --rm frontend npm run generate:api
          git diff --exit-code frontend/src/api/generated
