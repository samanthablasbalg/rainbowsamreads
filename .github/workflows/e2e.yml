name: E2E Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  browser_tests:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, mobile]
    env:
      COMPOSE_PROJECT_NAME: e2e-${{ matrix.project }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Same image as Backend and Frontend CI. Nothing is installed on the
      # runner: the test process runs in `e2e` on this image, and the browsers
      # come from Microsoft's image via the `browsers` service.
      - name: Build the dev image
        run: docker compose build e2e

      # e2e/node_modules is a named volume that starts empty, and `run` replaces
      # a service's command, so nothing installs into it on boot the way the
      # frontend does. It persists between `run` invocations, so the test step
      # below sees it.
      - name: Install e2e dependencies
        run: docker compose run --rm e2e npm ci

      # Starts the whole chain on the way in — db, api, frontend, proxy and
      # browsers, each waited on via depends_on/healthcheck.
      - name: Run Playwright tests
        run: docker compose run --rm e2e npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright debug artifacts
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-debug-${{ matrix.project }}
          path: e2e/test-results/
          retention-days: 30

      # Every browser job emits a blob rather than its own HTML report. The
      # publish-report job merges the three blobs into the one report deployed
      # to Pages, so it still shows the complete cross-browser run.
      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-report-${{ matrix.project }}
          path: e2e/blob-report/
          retention-days: 30

  # The branch ruleset requires a check named exactly `e2e`. Matrix jobs are
  # reported as one check per browser, so this small fan-in preserves that
  # stable required-check interface and reflects only whether the tests passed.
  e2e:
    needs: browser_tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check browser projects
        env:
          BROWSER_TESTS_RESULT: ${{ needs.browser_tests.result }}
        run: test "$BROWSER_TESTS_RESULT" = success

  # Deploying to Pages requires this job to declare `environment: github-pages`,
  # which makes GitHub Actions track a deployment whose status mirrors this
  # job's own conclusion. Keeping it separate from `e2e` means that status reflects
  # whether the merged report actually published, while `e2e` remains the test signal.
  publish-report:
    needs: browser_tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Playwright blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-report-*
          path: all-blob-reports/
          merge-multiple: true

      # Report merging needs Playwright's JavaScript package but launches no
      # browser, so installing the small e2e package directly on the runner
      # avoids starting a second Compose stack after all test jobs have ended.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install report dependencies
        working-directory: e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Merge Playwright reports
        working-directory: e2e
        run: npx playwright merge-reports --reporter html ../all-blob-reports

      - name: Upload Playwright Report Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: e2e/playwright-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
