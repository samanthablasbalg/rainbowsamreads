name: E2E Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reading_tracker_e2e
      # Set here rather than inherited from compose.yaml like the backend job
      # does, because Playwright's webServer starts a bare uvicorn on the runner
      # rather than a container. A literal, not a secret: Dependabot runs resolve
      # secrets.* to empty, and this signs sessions in a database the job drops.
      # Goes away when e2e moves into containers (#181).
      SESSION_SECRET: ci-only

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The same container definition used locally. It already creates
      # reading_tracker_e2e, so db.setup.ts's create-if-missing is a no-op.
      - name: Start the database
        run: docker compose up db -d --wait

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: e2e

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
