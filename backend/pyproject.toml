[project]
name = "reading-tracker-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1,<2",
    "authlib>=1.7.2,<2",
    "fastapi>=0.136.3,<1",
    "httpx>=0.28.1,<1",
    "httpx2>=2.12.0,<3",
    "itsdangerous>=2.2.0,<3",
    "psycopg2-binary>=2.9.12,<3",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2.2,<2",
    "sqlalchemy>=2.0.55,<2.1",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.49.0,<1",
]

[dependency-groups]
dev = [
    "import-linter>=2.13,<3",
    "mypy>=2.1.0,<3",
    "pre-commit>=4.6.0,<5",
    "pytest>=9.0.3,<10",
    "ruff>=0.15.16,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = ["migrations/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common bug patterns)
    "UP",  # pyupgrade (suggests modern Python syntax)
]
ignore = [
    "B008",  # FastAPI uses Depends() in argument defaults by design
]

[tool.importlinter]
root_package = "app"
# Required to name fastapi, which lives outside the root package, as forbidden.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layering: api depends on services depends on crud"
type = "layers"
layers = ["app.api", "app.services", "app.crud"]

# The property that makes a service worth having: it can be called from a seed script,
# a data migration or a REPL. Domain errors are plain-Python exceptions in
# app.exceptions, mapped to HTTP status once in main.py, so nothing below the API layer
# needs the framework.
[[tool.importlinter.contracts]]
name = "Business rules run without a request"
type = "forbidden"
source_modules = ["app.services", "app.crud"]
forbidden_modules = ["fastapi"]
# Direct imports only. app.exceptions and app.database both import fastapi -- the first
# because it also registers the handlers, the second for get_db -- so every service
# reaches it transitively today. Tightening this means splitting those two modules.
allow_indirect_imports = true

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
